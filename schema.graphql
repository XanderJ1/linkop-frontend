type Query {
  events(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int
    id: fetchIdInput!

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [EventContextSortInput!]
    where: EventContextFilterInput
  ): ReminderContext!
  eventsNearMe(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
    location: currentLocationInput!
    order: [EventContextSortInput!]
    where: EventContextFilterInput
  ): EventsNearMeConnection
  fetchUserContext(userId: UUID!): UserContext!
  fetchUsers(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [UserContextSortInput!]
    where: UserContextFilterInput
  ): FetchUsersConnection
  guestList(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int
    input: guestListInput!

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [GuestContextSortInput!]
    where: GuestContextFilterInput
  ): GuestListConnection
  invitedEvents(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [EventContextSortInput!]
    where: EventContextFilterInput
  ): InvitedEventsConnection
  myEvents(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [EventContextSortInput!]
    where: EventContextFilterInput
  ): MyEventsConnection
  myReminders(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [ReminderContextSortInput!]
    userId: UUID!
    where: ReminderContextFilterInput
  ): MyRemindersConnection
  name: String!
  reminders(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
    order: [ReminderContextSortInput!]
    where: ReminderContextFilterInput
  ): RemindersConnection
}

